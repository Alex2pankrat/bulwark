name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_BIN: /opt/godot/godot

jobs:
  tests:
    timeout-minutes: 25
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          # The export templates are fetched here, once, and shared with every export job
          # through an artifact: simultaneous anonymous downloads of the same release
          # assets otherwise trip GitHub's per-IP asset budget.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Share engine downloads with export jobs
        uses: actions/upload-artifact@v4
        with:
          name: godot-downloads
          path: |
            /tmp/godot.zip
            /tmp/templates.tpz
          if-no-files-found: error

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import || true'

      - name: Unit tests
        run: '"$GODOT_BIN" --headless --path . res://tests/test_core.tscn'

      - name: Level smoke test
        run: '"$GODOT_BIN" --headless --path . res://tests/smoke_level.tscn'

      - name: UI screen tests
        run: '"$GODOT_BIN" --headless --path . res://tests/test_screens.tscn'

      - name: Balance regression (autoplay)
        run: |
          set -euo pipefail
          for d in 0 1 2; do
            "$GODOT_BIN" --headless --fixed-fps 480 --path . res://tests/autoplay.tscn -- --difficulty="$d"
          done

      - name: GDScript lint
        run: |
          python3 -m pip install --quiet --disable-pip-version-check gdtoolkit==4.5.0
          gdlint $(find src -name '*.gd')

      - name: Version consistency check
        run: python3 tools/check_version.py

  screenshots:
    name: Screenshots
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        uses: actions/download-artifact@v4
        with:
          name: godot-downloads
          path: /opt/godot-dl

      - name: Unpack Godot
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          unzip -q /opt/godot-dl/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import || true'

      - name: Capture screenshots
        run: |
          mkdir -p /tmp/shots
          # screenshot.gd drives real scenes with a viewport + DisplayServer, so it needs a
          # real display, not the headless display server (which never resolves
          # RenderingServer.frame_post_draw and hangs). xvfb-run is preinstalled on ubuntu runners.
          xvfb-run -a "$GODOT_BIN" --path . res://tools/screenshot.tscn -- --out=/tmp/shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots
          if-no-files-found: error

  export:
    name: Export (${{ matrix.preset }})
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Web
            out: build/web/index.html
            artifact: bulwark-web
          - preset: Linux
            out: build/linux/bulwark.x86_64
            artifact: bulwark-linux
          - preset: Windows
            out: build/windows/bulwark.exe
            artifact: bulwark-windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        uses: actions/download-artifact@v4
        with:
          name: godot-downloads
          path: /opt/godot-dl

      - name: Unpack Godot and templates
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          unzip -q /opt/godot-dl/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /opt/godot-dl/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import || true'

      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.out }}")"
          "$GODOT_BIN" --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.preset == 'Web' && 'web' || (matrix.preset == 'Linux' && 'linux' || 'windows') }}
          if-no-files-found: error

  android:
    name: Export (Android)
    needs: tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          # Reuse the SDK preinstalled on GitHub-hosted runners when present; otherwise set up
          # command-line tools ourselves. Godot 4.7's export template builds against
          # compileSdk 36 / build-tools 36.1.0 / NDK 29.0.14206865 (see
          # platform/android/java/app/config.gradle in the engine sources).
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            for candidate in "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                export ANDROID_SDK_ROOT="$candidate"
                break
              fi
            done
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            curl -fsSL -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # `-print -quit` makes find exit on its own; a `find | head` pipeline would
            # trip `pipefail` via SIGPIPE.
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            # SDK root exists but carries no sdkmanager: fetch command-line tools into it.
            curl -fsSL -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          # `yes` gets SIGPIPE when sdkmanager exits; swallow it under pipefail.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Godot + export templates
        uses: actions/download-artifact@v4
        with:
          name: godot-downloads
          path: /opt/godot-dl

      - name: Unpack Godot and templates
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          unzip -q /opt/godot-dl/godot.zip -d /opt/godot
          mv "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /opt/godot-dl/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          # Unquoted EOF: $JAVA_HOME and $ANDROID_SDK_ROOT must expand into the settings file.
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          grep -n "sdk_path" ~/.config/godot/editor_settings-4.7.tres

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ci
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ci/bulwark-release.keystore

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import || true'

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/ci/bulwark-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-release "Android" build/android/bulwark.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bulwark-android
          path: build/android/bulwark.apk
          if-no-files-found: error

  installer-windows:
    timeout-minutes: 20
    name: Installer (Windows .msi)
    needs: [export]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.zip"
          mkdir -p /c/godot
          unzip -q /tmp/godot.zip -d /c/godot
          mv "/c/godot/Godot_v${GODOT_VERSION}-stable_win64.exe" /c/godot/godot.exe
          /c/godot/godot.exe --version

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          # --export-release needs the export templates installed headless; without them
          # Godot aborts the export. Download the platform-agnostic templates.tpz once.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        shell: bash
        run: '/c/godot/godot.exe --headless --path . --import || true'

      - name: Export Windows build
        shell: bash
        run: |
          mkdir -p build/windows
          /c/godot/godot.exe --headless --path . --export-release "Windows" build/windows/bulwark.exe

      - name: Install WiX Toolset
        shell: bash
        run: choco install wix3 --yes --no-progress

      - name: Build .msi
        shell: bash
        env:
          VERSION: ${{ github.event.ref_name }}
        run: |
          set -euo pipefail
          # Fall back to the project version when the ref is not a tag (e.g. a PR branch).
          if not echo "$VERSION" | grep -q '^v[0-9]'; then
            VERSION="v$(sed -n 's/.*config\/version="\([^"]*\)".*/\1/p' project.godot | head -1)"
          fi
          # choco installs WiX into a versioned dir that is not always on PATH; locate it.
          for d in "/c/Program Files (x86)/WiX Toolset v3."* "/c/Program Files/WiX Toolset v3."*; do
            if [ -d "$d/bin" ]; then WIX_BIN="$d/bin"; break; fi
          done
          if [ -n "$WIX_BIN" ]; then export PATH="$WIX_BIN:$PATH"; fi
          mkdir -p build/msi
          candle -dVERSION="${VERSION#v}" -dBuildDir="${{ github.workspace }}/build/windows" \
            -out build/msi/bulwark.wixobj tools/installer/bulwark.wxs
          light -ext WixUIExtension -out "build/msi/bulwark-${VERSION}-windows-x86_64.msi" \
            build/msi/bulwark.wixobj

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: bulwark-windows-msi
          path: build/msi/bulwark-*-windows-x86_64.msi
          if-no-files-found: error

  installer-macos:
    timeout-minutes: 20
    name: Installer (macOS .dmg)
    needs: [export]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_macos.app/Contents/MacOS/Godot" /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          # --export-release needs the export templates installed headless; without them
          # Godot aborts the export. Download the platform-agnostic templates.tpz once.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: '/tmp/godot/godot --headless --path . --import || true'

      - name: Export macOS app
        run: |
          mkdir -p build/macos
          /tmp/godot/godot --headless --path . --export-release "macOS" build/macos/bulwark.app

      - name: Build .dmg
        env:
          VERSION: ${{ github.event.ref_name }}
        run: |
          set -euo pipefail
          if not echo "$VERSION" | grep -q '^v[0-9]'; then
            VERSION="v$(sed -n 's/.*config\/version="\([^"]*\)".*/\1/p' project.godot | head -1)"
          fi
          mkdir -p build/dmg/staging
          cp -R build/macos/bulwark.app build/dmg/staging/
          ln -s /Applications build/dmg/staging/Applications
          hdiutil create -volname "Bulwark ${VERSION}" -srcfolder build/dmg/staging \
            -ov -format UDZO "build/dmg/bulwark-${VERSION}-macos.dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: bulwark-macos-dmg
          path: build/dmg/bulwark-*-macos.dmg
          if-no-files-found: error

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export, android, installer-windows, installer-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Verify version bump
        run: |
          set -euo pipefail
          git fetch --tags --force
          current="${GITHUB_REF_NAME}"
          prev="$(git tag --sort=-creatordate | grep -v -x "$current" | head -1 || true)"
          if [ -n "$prev" ]; then
            python3 tools/check_version.py --prev "$prev"
          else
            echo "check_version: no previous release tag found; skipping bump check."
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release_files
          VERSION="${GITHUB_REF_NAME}"
          cp artifacts/bulwark-windows/bulwark.exe "release_files/bulwark-${VERSION}-windows-x86_64.exe"
          cp artifacts/bulwark-linux/bulwark.x86_64 "release_files/bulwark-${VERSION}-linux-x86_64"
          chmod +x "release_files/bulwark-${VERSION}-linux-x86_64"
          cp artifacts/bulwark-android/bulwark.apk "release_files/bulwark-${VERSION}-android.apk"
          (cd artifacts/bulwark-web && zip -qr "../../release_files/bulwark-${VERSION}-web.zip" .)
          cp artifacts/bulwark-windows-msi/bulwark-*-windows-x86_64.msi \
            "release_files/bulwark-${VERSION}-windows-x86_64.msi"
          cp artifacts/bulwark-macos-dmg/bulwark-*-macos.dmg \
            "release_files/bulwark-${VERSION}-macos.dmg"
      - uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
